<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarees - Shubharambh</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Back Button -->
  <a href="javascript:history.back()" class="back-btn">← Back</a>

  <header></header>

  <section class="category-page saree-page">
    <h2>Sarees Collection</h2>

    <div id="product-list" class="products"></div>
  </section>

  <div id="fav-panel">
    <h3>❤️ Favorites</h3>
    <div id="fav-items"></div>
  </div>

  <footer>
    <p>© 2026 Shubharambh</p>
  </footer>

  <script>
    const favContainer = document.getElementById("fav-items");
    let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

    function renderFavorites() {
      favContainer.innerHTML = "";
      favorites.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        favContainer.appendChild(img);
      });
    }

    function updateFavoriteButtons() {
      document.querySelectorAll(".fav-btn").forEach(btn => {
        const imgSrc = btn.previousElementSibling.src;

        if (favorites.includes(imgSrc)) {
          btn.classList.add("active");
          btn.textContent = "❤️";
        } else {
          btn.classList.remove("active");
          btn.textContent = "♡";
        }

        btn.addEventListener("click", () => {
          if (favorites.includes(imgSrc)) {
            favorites = favorites.filter(item => item !== imgSrc);
            btn.classList.remove("active");
            btn.textContent = "♡";
          } else {
            favorites.push(imgSrc);
            btn.classList.add("active");
            btn.textContent = "❤️";
          }

          localStorage.setItem("favorites", JSON.stringify(favorites));
          renderFavorites();
        });
      });
    }

    fetch("data/products.json")
    .then(response => response.json())
    .then(data => {
        const products = data.products || [];
      const container = document.getElementById("product-list");
      container.innerHTML = "";
          const sarees = products.filter(product => product.category === 'Sarees');

        sarees.forEach(product => {
          const card = document.createElement('div');
          card.className = 'card';

          card.innerHTML = `
            <img src="${product.image}" alt="${product.name}">
            <span class="fav-btn">♡</span>

          `;

          container.appendChild(card);
        });

        updateFavoriteButtons();
        renderFavorites();
      })
      .catch(error => console.error('Error loading sarees:', error));
  </script>

</body>
</html>
