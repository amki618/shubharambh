backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    file: "data/products.json"
    format: "json"
    fields:
      - label: "Products"
        name: "products"
        widget: "list"
        summary: "{{fields.category}}"
        fields:
          - label: Category
            name: category
            widget: select
            options:
              - Sarees
              - Dresses
              - Lehengas
              - Anarkalis
              - Kurtis
              - Cord Sets

          - label: Image
            name: image
            widget: image
